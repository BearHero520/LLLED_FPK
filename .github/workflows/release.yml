name: Build and publish FPK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate shell, CGI, JavaScript and Python
        shell: bash
        run: |
          set -euo pipefail
          for file in App.Native.UGreenLED/cmd/* App.Native.UGreenLED/app/server/*.sh App.Native.UGreenLED/app/server/lib/*.sh App.Native.UGreenLED/app/ui/*.cgi tests/*.sh; do
            bash -n "$file"
          done
          node --check App.Native.UGreenLED/app/www/js/app.js
          python3 -m py_compile scripts/preview_web.py

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/test_*.sh; do
            echo "==> $test_file"
            bash "$test_file"
          done

      - name: Build bundled UGREEN-NAS-Hardware control CLI
        run: python3 scripts/build_ugreenctl.py

      - name: Build patched bundled LED CLI
        run: python3 scripts/build_ugreen_leds_cli.py

      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' App.Native.UGreenLED/manifest | tr -d '[:space:]')"
          test -n "$version"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build FPK
        env:
          SOURCE_DATE_EPOCH: "0"
        run: python3 scripts/build_fpk.py --output-dir dist --expect-version "${{ steps.version.outputs.version }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: App.Native.UGreenLED-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          assets=(
            "dist/App.Native.UGreenLED-$VERSION.fpk"
            "dist/App.Native.UGreenLED.fpk"
            "dist/App.Native.UGreenLED-$VERSION.fpk.sha256"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "绿联 LED 灯控 v$VERSION" \
              --notes "$(sed -n 's/^changelog[[:space:]]*=[[:space:]]*//p' App.Native.UGreenLED/manifest)"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "绿联 LED 灯控 v$VERSION" \
              --notes "$(sed -n 's/^changelog[[:space:]]*=[[:space:]]*//p' App.Native.UGreenLED/manifest)" \
              --verify-tag
          fi
