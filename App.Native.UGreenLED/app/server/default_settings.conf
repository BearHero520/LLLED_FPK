[mode]
# off = 关闭全部 | on = 开启全部 | smart = 智能模式
global=smart

[daemon]
enabled=true
check_interval=5
io_idle_seconds=8
network_probe_interval=30
# ATA 电源状态查询间隔；活动速度仍按 check_interval 从 /proc/diskstats 采样。
disk_power_probe_interval=60
hotplug_check_interval=30

[activity]
# 速度超过阈值时闪动；速度越高，闪动越快。默认关闭以保持升级前行为。
disk_blink=false
network_blink=false
disk_threshold_kbps=128
network_threshold_kbps=32

[disk_colors]
active=0 255 0
idle=255 255 0
standby=0 100 255
deep_sleep=40 0 80
offline=off

[disk_brightness]
active=128
idle=64
standby=40
deep_sleep=24
offline=0

[netdev_colors]
disconnected=255 0 0
connected=0 80 255
vpn=160 0 255

[netdev_brightness]
disconnected=64
connected=48
vpn=64

[power]
smart_color=100 100 100
all_on_color=180 180 180
brightness=40

[hardware]
# auto = 已加载且可用的 sysfs 驱动优先，否则使用打包 CLI
# cli = 强制用户态 CLI；sysfs = 强制 led-ugreen 内核驱动
backend=auto
# auto = 读取 DMI；也可从 Web 手动选择内置机型档案
profile=auto
# auto = 跟随机型档案；必要时可手动强制 legacy 或 smbus-block
write_protocol=auto

[behavior]
remap_on_hotplug=true
manage_power=true
manage_netdev=true
# auto = 自动 HCTL | position = 按硬盘位置绑定 | disk = 按硬盘序列号绑定
disk_map_mode=auto

[disk_map]
